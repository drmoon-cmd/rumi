# 세 운영체제용 설치 파일 빌드.
# Actions 탭에서 수동 실행(Run workflow)하거나 v* 태그를 푸시하면 실행된다.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" -c packaging/constraints.txt
      - run: pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" -c packaging/constraints.txt
      - name: libmpv 내려받기
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download -R shinchiro/mpv-winbuild-cmake -p "mpv-dev-x86_64-2*.7z" -O mpv-dev.7z
          echo "libmpv 릴리스: $(gh release view -R shinchiro/mpv-winbuild-cmake --json tagName -q .tagName)"
          echo "libmpv SHA-256: $(sha256sum mpv-dev.7z)"
          7z x mpv-dev.7z -opackaging/windows/mpv
      - run: python packaging/build.py
      - name: 설치 파일 만들기 (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\rumi.iss
      - name: 백신 검사 (Microsoft Defender)
        shell: pwsh
        run: |
          $mp = "C:\Program Files\Windows Defender\MpCmdRun.exe"
          & $mp -SignatureUpdate | Out-Host
          & $mp -Scan -ScanType 3 -File "$PWD\dist" -DisableRemediation | Out-Host
          $code = $LASTEXITCODE
          if ($code -eq 2) { throw "Defender 가 위협을 발견했습니다. 위 로그를 확인하세요." }
          elseif ($code -ne 0) { Write-Warning "Defender 검사를 실행하지 못했습니다 (코드 $code)" }
          else { Write-Host "Defender: 위협 없음" }
          Get-FileHash dist\RumiSetup-*.exe -Algorithm SHA256 | Format-List | Out-Host
      - uses: actions/upload-artifact@v4
        with: { name: Rumi-windows, path: dist/RumiSetup-*.exe }

  # 두 번째 백신(ClamAV)으로 Windows 설치 파일을 한 번 더 검사
  scan:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: Rumi-windows, path: win }
      - run: sudo apt-get update && sudo apt-get install -y clamav
      - name: 백신 검사 (ClamAV)
        run: |
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          sha256sum win/*
          clamscan --version
          clamscan -r --infected --scan-archive=yes win/

  macos:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: brew install mpv
      - run: pip install -e ".[dev]" -c packaging/constraints.txt
      - run: python packaging/build.py
      - name: DMG 만들기
        run: hdiutil create -volname Rumi -srcfolder dist/Rumi.app -ov -format UDZO dist/Rumi-macos.dmg
      - uses: actions/upload-artifact@v4
        with: { name: Rumi-macos, path: dist/Rumi-macos.dmg }

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libmpv-dev
      - run: pip install -e ".[dev]" -c packaging/constraints.txt
      - run: python packaging/build.py
      - run: tar -C dist -czf dist/Rumi-linux-x86_64.tar.gz Rumi
      - uses: actions/upload-artifact@v4
        with: { name: Rumi-linux, path: dist/Rumi-linux-x86_64.tar.gz }
