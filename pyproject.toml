[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rumi"
version = "0.3.11"
description = "mpv 기반 설치형 동영상 플레이어 + 동영상 라이브러리/중복 정리"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,!=6.12.0",  # 6.12.0: signal emit 마다 True 참조 수가 줄어 Python 3.11 에서 다운
    "python-mpv>=1.0.5",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
rumi = "rumi.__main__:main"

[tool.setuptools.packages.find]
include = ["rumi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
rumi = ["shaders/*.glsl", "shaders/anime4k/*"]
